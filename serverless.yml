org: yoacorgz
service: serverlessTemplateNode

provider:
  name: aws
  runtime: nodejs20.x
  architecture: arm64
  region: us-east-1

package:
  individually: true

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    exclude:
      - "@aws-sdk/*"

functions:
  hello:
    handler: src/hello.handler
    events:
      - httpApi:
          path: /
          method: GET
